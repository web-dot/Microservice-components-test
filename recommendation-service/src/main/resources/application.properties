spring.application.name=recommendation-service
# -------------------------
# Consumer Configuration
# -------------------------
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=recommendation-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=bookFinished:com.project.recommendation_service.event.BookFinishedEvent,reviewSubmitted:com.project.recommendation_service.event.ReviewSubmittedEvent